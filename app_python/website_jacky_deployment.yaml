# app/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-jacky
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website-jacky
  template:
    metadata:
      labels:
        app: website-jacky
    spec:
      containers:
      - name: website-jacky
        image: 10.6.0.190:80/local/website-jacky:latest
        ports:
        - containerPort: 5000