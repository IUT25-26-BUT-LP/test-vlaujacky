# app/argocd-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website-jacky
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/IUT25-26-BUT-LP/test-vlaujacky'
    targetRevision: HEAD
    path: app_python
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
